<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Full Stack To-Do Application</h1>

      <div class="user-panel">
        <input id="userInput" type="text" placeholder="Enter your name" />
        <button id="loginBtn" class="primary-btn">Set User</button>
      </div>

      <form id="taskForm" class="task-form">
        <input id="taskInput" type="text" placeholder="Add a new task" required />
        <button class="primary-btn" type="submit">Add Task</button>
      </form>

      <ul id="taskList" class="task-list"></ul>
    </div>

    <script src="app.js"></script>
  </body>
</html>
